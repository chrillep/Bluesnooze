version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    labels: [dependencies, github_actions]
    cooldown:
      default-days: 14
    schedule:
      interval: weekly
  - package-ecosystem: swift
    directory: /src
    labels: [dependencies, swift]
    cooldown:
      default-days: 14
    schedule:
      interval: weekly
