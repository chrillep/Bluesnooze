name: Build

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build macOS app
        uses: Apple-Actions/xcodebuild@082b0cef7dd252ee247a2b40358ba5cbe992fad7 # v1.3.0
        with:
          project: src/Bluesnooze.xcodeproj
          scheme: Bluesnooze
          configuration: Debug
          sdk: macosx
          destination: generic/platform=macOS
          build-settings: |
            MACOSX_DEPLOYMENT_TARGET=12.0
            CODE_SIGNING_ALLOWED=NO
      - name: Package unsigned app
        run: ditto -c -k --sequesterRsrc --keepParent .build/DerivedData/Build/Products/Debug/Bluesnooze.app Bluesnooze-unsigned.zip
      - name: Upload app
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: Bluesnooze-unsigned.zip
          archive: false
          if-no-files-found: error
      - name: Package build results
        if: ${{ !cancelled() }}
        run: |
          if [ -d .build/Artifacts/Bluesnooze.xcresult ]; then
            ditto -c -k --sequesterRsrc --keepParent .build/Artifacts/Bluesnooze.xcresult .build/Bluesnooze.xcresult.zip
          else
            echo "No Xcode result bundle was produced."
          fi
      - name: Upload build diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-diagnostics
          include-hidden-files: true
          path: |
            .build/Bluesnooze-build.log
            .build/Bluesnooze.xcresult.zip
